<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bistrodesk Manager</title>
<!--
  F4.3 - Mobile Manager Companion (AI Backbone Addendum). A single self-contained static page
  (no build step, no framework) served by chefpay-server itself at /manager/, reusing the exact
  same REST API the JavaFX desktop client talks to (POST /api/auth/login, GET
  /api/eod/anomalies/unresolved, POST /api/eod/anomalies/{id}/resolve). The SRS's own "Open
  Question" (Section 12.3) explicitly resolves in favor of "a responsive web view reusing the
  existing REST API" over a native app, given this codebase has no existing mobile build - that's
  exactly what this is.

  This file is a REAL deployed web page served from ChefPay's own infrastructure (not a sandboxed
  Cowork artifact), so using localStorage for the JWT/session is the correct, standard approach for
  a web app like this - not the in-memory-only restriction that applies to Claude-authored preview
  artifacts.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1c2530;
    --text-muted: #6b7480;
    --border: #e2e5ea;
    --accent: #2c3e50;
    --accent-2: #34495e;
    --success: #1f9d55;
    --danger: #d64545;
    --critical-bg: #fdeaea;
    --critical-border: #e08a8a;
    --critical-text: #a02020;
    --medium-bg: #fdf3e0;
    --medium-border: #e5c27a;
    --medium-text: #8a5a00;
    --low-bg: #eef0f3;
    --low-border: #c9cdd4;
    --low-text: #4a5260;
    --shadow: 0 1px 3px rgba(20, 25, 35, 0.08), 0 1px 2px rgba(20, 25, 35, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --surface: #1d232c;
      --text: #eef1f5;
      --text-muted: #9aa4b2;
      --border: #2c333d;
      --accent: #3d5468;
      --accent-2: #4a6579;
      --critical-bg: #3a1e1e;
      --critical-border: #6b2f2f;
      --critical-text: #ff8a8a;
      --medium-bg: #3a2f14;
      --medium-border: #6b551f;
      --medium-text: #f0c169;
      --low-bg: #232a33;
      --low-border: #38424f;
      --low-text: #b7c0cc;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior-y: none;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  a { color: inherit; }

  /* ---- Header ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--accent); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow);
  }
  header .title { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
  header .subtitle { font-size: 11px; opacity: 0.75; margin-top: 2px; }
  header button.icon-btn {
    background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* ---- Screens ---- */
  .screen { flex: 1; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---- Login ---- */
  #loginScreen { align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--surface); border-radius: 16px;
    padding: 28px 24px; box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .login-card h1 { font-size: 20px; margin: 0 0 4px; }
  .login-card p.tagline { color: var(--text-muted); font-size: 13px; margin: 0 0 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px;
  }
  .field input:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .primary-btn {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.6; }
  .error-text { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; }

  /* ---- List screen ---- */
  #listScreen .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; gap: 8px;
  }
  #listScreen .toolbar .count { font-size: 13px; color: var(--text-muted); }
  #listScreen .toolbar button {
    background: none; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  #cardList { flex: 1; overflow-y: auto; padding: 4px 12px 24px; }
  .empty-state { text-align: center; color: var(--text-muted); padding: 60px 24px; font-size: 14px; }

  .card-wrap { position: relative; margin-bottom: 12px; border-radius: 14px; overflow: hidden; }
  .swipe-hint {
    position: absolute; inset: 0; display: flex; align-items: center; font-weight: 700;
    font-size: 13px; padding: 0 18px; color: #fff;
  }
  .swipe-hint.right { justify-content: flex-start; background: var(--success); }
  .swipe-hint.left { justify-content: flex-end; background: var(--danger); }
  .anomaly-card {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-left: 5px solid var(--low-border); border-radius: 14px; padding: 14px 16px;
    box-shadow: var(--shadow); touch-action: pan-y; cursor: grab; user-select: none;
  }
  .anomaly-card.sev-CRITICAL, .anomaly-card.sev-HIGH { border-left-color: var(--critical-border); }
  .anomaly-card.sev-MEDIUM { border-left-color: var(--medium-border); }
  .anomaly-card.sev-LOW { border-left-color: var(--low-border); }
  .anomaly-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .badge {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px;
  }
  .badge.sev-CRITICAL, .badge.sev-HIGH { background: var(--critical-bg); color: var(--critical-text); }
  .badge.sev-MEDIUM { background: var(--medium-bg); color: var(--medium-text); }
  .badge.sev-LOW { background: var(--low-bg); color: var(--low-text); }
  .anomaly-card .category { font-weight: 700; font-size: 14.5px; margin-top: 8px; }
  .anomaly-card .desc {
    font-size: 13px; color: var(--text-muted); margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .anomaly-card .meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11.5px; color: var(--text-muted); }
  .anomaly-card .amount { font-weight: 700; color: var(--text); }

  /* ---- Modal (detail + escalate reason) ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,12,16,0.5); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.active { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 480px; background: var(--surface); border-radius: 18px 18px 0 0;
    max-height: 88vh; overflow-y: auto; padding: 8px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    animation: slideUp 0.22s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-sheet .handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 10px auto 14px; }
  .modal-sheet h2 { font-size: 17px; margin: 0 0 4px; }
  .modal-sheet .detail-row { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .modal-sheet .detail-row span:first-child { color: var(--text-muted); }
  .modal-sheet .full-desc { font-size: 14px; line-height: 1.5; margin: 12px 0; }
  .resolution-options { display: flex; flex-direction: column; gap: 8px; margin: 16px 0 10px; }
  .resolution-options label {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .resolution-options label.checked { border-color: var(--accent); background: var(--bg); }
  .modal-sheet textarea, .modal-sheet input[type=text] {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; margin-top: 4px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-cancel { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
  .btn-confirm { background: var(--accent); border: none; color: #fff; }
  .btn-confirm:disabled { opacity: 0.5; }
  .cctv-link { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--accent-2); text-decoration: underline; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #1c2530; color: #fff; padding: 11px 18px; border-radius: 30px; font-size: 13px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 80;
    max-width: 88vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <div id="loginScreen" class="screen active">
    <div class="login-card">
      <h1>Bistrodesk Manager</h1>
      <p class="tagline">Review and resolve open anomalies from anywhere - the same audit review data as the desktop EOD wizard.</p>
      <!-- Security fix: this screen is strictly username + password, no PIN option - a manager
           login must never be satisfiable by a 4-6 digit PIN alone from an unmanaged personal
           phone. The Quick-PIN shape stays available only on physical, on-premise POS terminals. -->
      <form id="loginForm">
        <div class="field" id="usernameField">
          <label>Username</label>
          <input type="text" id="usernameInput" autocomplete="username" autocapitalize="none">
        </div>
        <div class="field" id="passwordField">
          <label>Password</label>
          <input type="password" id="passwordInput" autocomplete="current-password">
        </div>
        <button type="submit" class="primary-btn" id="loginSubmitBtn">Sign In</button>
      </form>
      <div class="error-text" id="loginError"></div>
    </div>
  </div>

  <div id="listScreen" class="screen">
    <header>
      <div>
        <div class="title">Open Anomalies</div>
        <div class="subtitle" id="userSubtitle"></div>
      </div>
      <button class="icon-btn" id="logoutBtn">Sign Out</button>
    </header>
    <div class="toolbar">
      <span class="count" id="listCount">Loading...</span>
      <button id="refreshBtn">Refresh</button>
    </div>
    <div id="cardList"></div>
  </div>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------------------
  // State & storage - a real deployed web page (not a sandboxed preview artifact), so
  // localStorage is the right, standard place for the session token and cached permissions.
  // ---------------------------------------------------------------------------------------
  var STORAGE_KEY = 'chefpay_manager_session_v1';
  var state = {
    token: null,
    displayName: null,
    permissions: [],
    anomalies: [],
    activeAnomalyId: null,
    deepLinkAnomalyId: null
  };

  function loadSession() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function saveSession(session) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); } catch (e) { /* ignore */ }
  }
  function clearSession() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  }

  // ---------------------------------------------------------------------------------------
  // API helper
  // ---------------------------------------------------------------------------------------
  function api(path, options) {
    options = options || {};
    var headers = options.headers || {};
    headers['Content-Type'] = 'application/json';
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    return fetch(path, {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (res) {
      return res.json().then(function (envelope) {
        if (!res.ok || envelope.success === false) {
          var msg = (envelope && envelope.message) ? envelope.message : ('Request failed (' + res.status + ')');
          var err = new Error(msg);
          err.status = res.status;
          throw err;
        }
        return envelope.data;
      });
    });
  }

  // ---------------------------------------------------------------------------------------
  // Toast
  // ---------------------------------------------------------------------------------------
  var toastTimer = null;
  function toast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  // ---------------------------------------------------------------------------------------
  // Screens
  // ---------------------------------------------------------------------------------------
  function showScreen(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) {
      s.classList.toggle('active', s.id === id);
    });
  }

  // ---------------------------------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------------------------------
  // Security fix: strictly username + password - no PIN mode toggle, no PIN field, no PIN
  // branch in the submit payload. See the HTML comment above the login form for the rationale.
  document.getElementById('loginForm').addEventListener('submit', function (evt) {
    evt.preventDefault();
    var errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    var submitBtn = document.getElementById('loginSubmitBtn');
    var payload = {
      deviceName: 'Manager Mobile Companion',
      deviceType: 'WEB_MOBILE',
      username: document.getElementById('usernameInput').value.trim(),
      password: document.getElementById('passwordInput').value
    };
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    api('/api/auth/login', { method: 'POST', body: payload }).then(function (data) {
      if (!data.permissions || data.permissions.indexOf('EOD_MANAGE') === -1) {
        errorEl.textContent = 'This account does not have permission to review anomalies (EOD_MANAGE required).';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        return;
      }
      state.token = data.token;
      state.displayName = data.displayName;
      state.permissions = data.permissions;
      saveSession({ token: state.token, displayName: state.displayName, permissions: state.permissions });
      enterApp();
    }).catch(function (err) {
      errorEl.textContent = err.message || 'Sign in failed.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function () {
    clearSession();
    state.token = null;
    state.displayName = null;
    state.permissions = [];
    state.anomalies = [];
    document.getElementById('usernameInput').value = '';
    document.getElementById('passwordInput').value = '';
    showScreen('loginScreen');
  });

  // ---------------------------------------------------------------------------------------
  // List screen
  // ---------------------------------------------------------------------------------------
  document.getElementById('refreshBtn').addEventListener('click', loadAnomalies);

  function enterApp() {
    document.getElementById('userSubtitle').textContent = state.displayName || '';
    showScreen('listScreen');
    loadAnomalies();
  }

  function loadAnomalies() {
    document.getElementById('listCount').textContent = 'Loading...';
    api('/api/eod/anomalies/unresolved').then(function (data) {
      state.anomalies = data;
      renderList();
      maybeOpenDeepLink();
    }).catch(function (err) {
      if (err.status === 401 || err.status === 403) {
        toast('Session expired - please sign in again.');
        clearSession();
        state.token = null;
        showScreen('loginScreen');
        return;
      }
      document.getElementById('listCount').textContent = 'Could not load: ' + err.message;
    });
  }

  function severityRank(sev) {
    return { CRITICAL: 3, HIGH: 3, MEDIUM: 2, LOW: 1 }[sev] || 0;
  }

  function renderList() {
    var container = document.getElementById('cardList');
    container.innerHTML = '';
    var count = state.anomalies.length;
    document.getElementById('listCount').textContent = count === 0
      ? 'Nothing open right now'
      : count + ' open anomal' + (count === 1 ? 'y' : 'ies');

    if (count === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'All caught up. New anomalies will appear here as soon as they are detected.';
      container.appendChild(empty);
      return;
    }

    state.anomalies.forEach(function (a) {
      container.appendChild(buildCard(a));
    });
  }

  function formatMoney(v) {
    if (v === null || v === undefined) return null;
    var n = Number(v);
    return (n < 0 ? '-' : '') + '$' + Math.abs(n).toFixed(2);
  }

  function formatWhen(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function buildCard(a) {
    var wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.dataset.id = a.id;

    var hintRight = document.createElement('div');
    hintRight.className = 'swipe-hint right';
    hintRight.textContent = '✓ Mark Legitimate';
    var hintLeft = document.createElement('div');
    hintLeft.className = 'swipe-hint left';
    hintLeft.textContent = 'Escalate ⚑';
    wrap.appendChild(hintRight);
    wrap.appendChild(hintLeft);

    var card = document.createElement('div');
    card.className = 'anomaly-card sev-' + a.severity;

    var amountText = formatMoney(a.amountImpact);
    card.innerHTML =
      '<div class="row1">' +
        '<span class="badge sev-' + a.severity + '">' + a.severity + '</span>' +
        '<span style="font-size:11px;color:var(--text-muted);">' + formatWhen(a.detectedAt) + '</span>' +
      '</div>' +
      '<div class="category">' + escapeHtml(a.category) + '</div>' +
      '<div class="desc">' + escapeHtml(a.description) + '</div>' +
      '<div class="meta">' +
        '<span>' + escapeHtml(a.businessDate || '') + (a.involvedUserName ? ' &middot; ' + escapeHtml(a.involvedUserName) : '') + '</span>' +
        (amountText ? '<span class="amount">' + amountText + '</span>' : '<span></span>') +
      '</div>';

    wrap.appendChild(card);
    attachSwipeHandlers(wrap, card, a);
    return wrap;
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------------------------------------------------------------------------------------
  // Swipe gestures (pointer events - unifies touch + mouse so this also works while testing
  // on a desktop browser). Swipe-right = Mark Legitimate, swipe-left = Escalate/Flag for
  // Follow-up - the SRS's own "same resolution vocabulary as the desktop review, via swipe
  // gestures" (Section 11.3). A tap (negligible movement) opens the full detail sheet instead.
  // ---------------------------------------------------------------------------------------
  var SWIPE_THRESHOLD = 84;
  var TAP_TOLERANCE = 8;

  function attachSwipeHandlers(wrap, card, anomaly) {
    var startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false;

    card.addEventListener('pointerdown', function (evt) {
      startX = evt.clientX; startY = evt.clientY; dx = 0; dragging = true; decided = false; horizontal = false;
      card.style.transition = 'none';
      try { card.setPointerCapture(evt.pointerId); } catch (e) { /* ignore */ }
    });

    card.addEventListener('pointermove', function (evt) {
      if (!dragging) return;
      dx = evt.clientX - startX;
      var dy = evt.clientY - startY;
      if (!decided) {
        if (Math.abs(dx) > TAP_TOLERANCE || Math.abs(dy) > TAP_TOLERANCE) {
          decided = true;
          horizontal = Math.abs(dx) > Math.abs(dy);
        }
      }
      if (horizontal) {
        card.style.transform = 'translateX(' + dx + 'px)';
        var hintRight = wrap.querySelector('.swipe-hint.right');
        var hintLeft = wrap.querySelector('.swipe-hint.left');
        hintRight.style.opacity = dx > 0 ? Math.min(1, dx / SWIPE_THRESHOLD) : 0;
        hintLeft.style.opacity = dx < 0 ? Math.min(1, -dx / SWIPE_THRESHOLD) : 0;
      }
    });

    function finishDrag(evt) {
      if (!dragging) return;
      dragging = false;
      card.style.transition = 'transform 0.2s ease';
      try { card.releasePointerCapture(evt.pointerId); } catch (e) { /* ignore */ }

      if (horizontal && Math.abs(dx) >= SWIPE_THRESHOLD) {
        if (dx > 0) {
          card.style.transform = 'translateX(120%)';
          setTimeout(function () { resolveQuick(anomaly, wrap, 'LEGITIMATE_ERROR', null); }, 150);
        } else {
          card.style.transform = 'translateX(-120%)';
          promptEscalateReason(anomaly, wrap, card);
        }
        return;
      }
      card.style.transform = 'translateX(0)';
      var hintRight = wrap.querySelector('.swipe-hint.right');
      var hintLeft = wrap.querySelector('.swipe-hint.left');
      hintRight.style.opacity = 0;
      hintLeft.style.opacity = 0;

      if (!horizontal && Math.abs(dx) <= TAP_TOLERANCE) {
        openDetail(anomaly);
      }
    }

    card.addEventListener('pointerup', finishDrag);
    card.addEventListener('pointercancel', finishDrag);
  }

  function resolveQuick(anomaly, wrap, resolutionType, escalationReasonCode) {
    api('/api/eod/anomalies/' + anomaly.id + '/resolve', {
      method: 'POST',
      body: { resolutionType: resolutionType, escalationReasonCode: escalationReasonCode, note: 'Resolved via Manager Mobile Companion' }
    }).then(function () {
      removeAnomalyFromState(anomaly.id);
      toast(resolutionType === 'LEGITIMATE_ERROR' ? 'Marked legitimate.' : 'Escalated.');
    }).catch(function (err) {
      // Snap the card back - the server rejected the resolution (already resolved elsewhere,
      // missing reason, session expired, etc.) so the optimistic swipe must be undone.
      wrap.querySelector('.anomaly-card').style.transform = 'translateX(0)';
      toast('Could not resolve: ' + err.message);
    });
  }

  function removeAnomalyFromState(id) {
    state.anomalies = state.anomalies.filter(function (a) { return a.id !== id; });
    renderList();
  }

  function promptEscalateReason(anomaly, wrap, card) {
    var backdrop = document.getElementById('modalBackdrop');
    var sheet = document.getElementById('modalSheet');
    sheet.innerHTML =
      '<div class="handle"></div>' +
      '<h2>Escalate this anomaly</h2>' +
      '<p style="font-size:13px;color:var(--text-muted);margin:4px 0 14px;">A reason is required to confirm/escalate ("Confirmed Theft"), matching the desktop EOD review.</p>' +
      '<div class="field"><label>Reason</label><textarea id="escalateReasonInput" rows="3" placeholder="e.g. Confirmed via CCTV review"></textarea></div>' +
      '<div class="modal-actions">' +
        '<button class="btn-cancel" id="escalateCancelBtn">Cancel</button>' +
        '<button class="btn-confirm" id="escalateConfirmBtn">Escalate</button>' +
      '</div>';
    backdrop.classList.add('active');

    function cancel() {
      backdrop.classList.remove('active');
      card.style.transform = 'translateX(0)';
    }
    document.getElementById('escalateCancelBtn').addEventListener('click', cancel);
    document.getElementById('escalateConfirmBtn').addEventListener('click', function () {
      var reason = document.getElementById('escalateReasonInput').value.trim();
      if (!reason) {
        toast('A reason is required to escalate.');
        return;
      }
      backdrop.classList.remove('active');
      resolveQuick(anomaly, wrap, 'CONFIRMED_THEFT', reason);
    });
  }

  // ---------------------------------------------------------------------------------------
  // Full detail sheet (tap) - all 3 resolution types, matching EodController.resolveAnomaly /
  // the desktop's exact resolution vocabulary (Section 11.3: "same resolution vocabulary").
  // ---------------------------------------------------------------------------------------
  function openDetail(anomaly) {
    state.activeAnomalyId = anomaly.id;
    var backdrop = document.getElementById('modalBackdrop');
    var sheet = document.getElementById('modalSheet');

    var amountText = formatMoney(anomaly.amountImpact);
    var rows =
      row('Severity', anomaly.severity) +
      row('Detected', formatWhen(anomaly.detectedAt)) +
      row('Business Date', anomaly.businessDate) +
      (anomaly.involvedUserName ? row('Involved User', anomaly.involvedUserName) : '') +
      (amountText ? row('Amount Impact', amountText) : '') +
      (anomaly.referenceOrderId ? row('Order Ref', anomaly.referenceOrderId) : '');

    sheet.innerHTML =
      '<div class="handle"></div>' +
      '<span class="badge sev-' + anomaly.severity + '">' + anomaly.severity + '</span>' +
      '<h2 style="margin-top:8px;">' + escapeHtml(anomaly.category) + '</h2>' +
      '<div class="full-desc">' + escapeHtml(anomaly.description) + '</div>' +
      rows +
      (anomaly.cctvFootageUrl ? '<a class="cctv-link" href="' + escapeHtml(anomaly.cctvFootageUrl) + '" target="_blank" rel="noopener">View CCTV Footage &rarr;</a>' : '') +
      '<div class="resolution-options" id="resolutionOptions">' +
        resolutionOption('LEGITIMATE_ERROR', 'Legitimate Error', 'An honest mistake, not misconduct.') +
        resolutionOption('CONFIRMED_THEFT', 'Confirmed Theft', 'Requires a reason - escalates the case.') +
        resolutionOption('FALSE_POSITIVE', 'False Positive', 'The rule fired but nothing is wrong here.') +
      '</div>' +
      '<div class="field" id="detailReasonField" style="display:none;"><label>Escalation Reason (required)</label><input type="text" id="detailReasonInput" placeholder="e.g. Confirmed via CCTV review"></div>' +
      '<div class="field"><label>Note (optional)</label><textarea id="detailNoteInput" rows="2" placeholder="Any additional context"></textarea></div>' +
      '<div class="modal-actions">' +
        '<button class="btn-cancel" id="detailCancelBtn">Close</button>' +
        '<button class="btn-confirm" id="detailSubmitBtn" disabled>Submit</button>' +
      '</div>';

    backdrop.classList.add('active');

    var selected = null;
    Array.prototype.forEach.call(sheet.querySelectorAll('.resolution-options label'), function (label) {
      label.addEventListener('click', function () {
        Array.prototype.forEach.call(sheet.querySelectorAll('.resolution-options label'), function (l) { l.classList.remove('checked'); });
        label.classList.add('checked');
        selected = label.dataset.value;
        document.getElementById('detailReasonField').style.display = selected === 'CONFIRMED_THEFT' ? '' : 'none';
        document.getElementById('detailSubmitBtn').disabled = false;
      });
    });

    document.getElementById('detailCancelBtn').addEventListener('click', function () {
      backdrop.classList.remove('active');
    });
    document.getElementById('detailSubmitBtn').addEventListener('click', function () {
      if (!selected) return;
      var reason = document.getElementById('detailReasonInput').value.trim();
      if (selected === 'CONFIRMED_THEFT' && !reason) {
        toast('A reason is required to confirm theft/escalate.');
        return;
      }
      var note = document.getElementById('detailNoteInput').value.trim();
      var btn = document.getElementById('detailSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      api('/api/eod/anomalies/' + anomaly.id + '/resolve', {
        method: 'POST',
        body: { resolutionType: selected, escalationReasonCode: selected === 'CONFIRMED_THEFT' ? reason : null, note: note || null }
      }).then(function () {
        backdrop.classList.remove('active');
        removeAnomalyFromState(anomaly.id);
        toast('Resolved.');
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Submit';
        toast('Could not resolve: ' + err.message);
      });
    });
  }

  function row(label, value) {
    return '<div class="detail-row"><span>' + label + '</span><span>' + escapeHtml(value) + '</span></div>';
  }
  function resolutionOption(value, label, hint) {
    return '<label data-value="' + value + '"><input type="radio" name="resolutionType" style="display:none;">' +
      '<span><strong>' + label + '</strong><br><span style="color:var(--text-muted);font-size:12px;">' + hint + '</span></span></label>';
  }

  document.getElementById('modalBackdrop').addEventListener('click', function (evt) {
    if (evt.target === this) this.classList.remove('active');
  });

  // ---------------------------------------------------------------------------------------
  // Deep link: ?anomaly=<id> opens that anomaly's detail sheet directly, once the (currently
  // open) list has loaded - resolved anomalies aren't linkable here since there is nothing left
  // to act on for them from this app.
  // ---------------------------------------------------------------------------------------
  function maybeOpenDeepLink() {
    if (!state.deepLinkAnomalyId) return;
    var match = state.anomalies.find(function (a) { return a.id === state.deepLinkAnomalyId; });
    state.deepLinkAnomalyId = null;
    if (match) {
      openDetail(match);
    } else {
      toast('That anomaly is no longer open.');
    }
  }

  // ---------------------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------------------
  var params = new URLSearchParams(window.location.search);
  state.deepLinkAnomalyId = params.get('anomaly');

  var existing = loadSession();
  if (existing && existing.token) {
    state.token = existing.token;
    state.displayName = existing.displayName;
    state.permissions = existing.permissions || [];
    enterApp();
  }
})();
</script>
</body>
</html>
