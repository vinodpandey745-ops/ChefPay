# Included by both server blocks in default.conf.template (no envsubst needed here).

# ---- Backend: everything the Spring Boot server owns ----------------------------------
location ~ ^/(api|ws|platform|webhooks|manager|admin|app)(/|$) {
    proxy_pass http://chefpay_server;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;     # was: $scheme

    # Long-lived WebSocket (/ws) connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /actuator/health {
    proxy_pass http://chefpay_server;
    proxy_set_header Host $host;
}

# ---- Web UI (static) ---------------------------------------------------------------------
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html { add_header Cache-Control "no-cache"; }
location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }

location / {
    try_files $uri $uri/ /index.html;
}
